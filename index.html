<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SocialUkrBoost Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        p {
            color: var(--hint-color);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(128, 128, 128, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            text-align: left;
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SocialUkrBoost 🚀</h1>
        <p>Виконуйте завдання, переглядайте рекламу та отримуйте бонуси.</p>

        <div class="card">
            <h3 id="user-greeting">Привіт, користувачу!</h3>
            <p id="user-platform">Визначення платформи...</p>
        </div>

        <div class="card">
            <h3>Рекламний блок</h3>
            <p>Натисніть кнопку нижче, щоб переглянути спонсорське оголошення та підтримати проєкт.</p>
            <button class="btn" onclick="showAd()">Дивитися рекламу</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user && user.first_name) {
            document.getElementById('user-greeting').innerText = `Привіт, ${user.first_name}!`;
        }

        const platform = tg.platform;
        document.getElementById('user-platform').innerText = `Платформа: ${platform}`;

        function showAd() {
            alert("Функція показу реклами буде активована після підключення рекламної мережі.");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialUkrBoost | Просування</title>
    <!-- Підключаємо Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Підключаємо офіційний Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/adsgram.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; font-size: 20px; }
        p { font-size: 14px; color: var(--tg-theme-hint-color, #707579); }
        .balance { font-size: 18px; font-weight: bold; margin: 15px 0; }
        .btn {
            background-color: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #707579);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>SocialUkrBoost</h2>
        <p>Платформа для просування та підтримки українських спільнот і контенту.</p>
        
        <div class="balance">Баланс: <span id="userBalance">0.00</span> GRAM</div>

        <button class="btn" id="watchAdBtn">Дивитись рекламу</button>
    </div>

    <div class="footer">@socialukrboost_bot</div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        // Ініціалізація Adsgram SDK (замініть YOUR_BLOCK_ID на реальний ID рекламного блоку)
        const adController = window.Adsgram ? window.Adsgram.init({ blockId: "47962" }) : null;

        document.getElementById('watchAdBtn').addEventListener('click', async () => {
            const watchBtn = document.getElementById('watchAdBtn');
            watchBtn.disabled = true;
            watchBtn.innerText = "Завантаження реклами...";

            if (adController) {
                try {
                    // Запуск показу реальної реклами
                    await adController.show();
                    sendRewardToBot();
                } catch (e) {
                    console.log("Показ реклами скасовано або сервер недоступний:", e);
                    // Якщо реклама не завантажилась через модерацію — на час тестів можна залишити симуляцію
                    alert("Режим симуляції: перегляд зараховано!");
                    sendRewardToBot();
                }
            } else {
                // Запасний варіант симуляції
                setTimeout(() => {
                    alert("Перегляд зараховано!");
                    sendRewardToBot();
                }, 1000);
            }
        });

        function sendRewardToBot() {
            const watchBtn = document.getElementById('watchAdBtn');
            watchBtn.disabled = false;
            watchBtn.innerText = "Дивитись рекламу";
            
            const payload = JSON.stringify({
                event: "ad_watched",
                reward: 0.01
            });

            if (window.Telegram.WebApp.sendData) {
                window.Telegram.WebApp.sendData(payload);
            }
        }
    </script>
</body>
</html>

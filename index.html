<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialUkrBoost | Просування</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-sizing: border-box;
            margin-top: 20px;
        }
        h2 { margin-top: 0; font-size: 20px; }
        p { font-size: 14px; color: var(--tg-theme-hint-color, #707579); }
        .balance { font-size: 18px; font-weight: bold; margin: 15px 0; }
        .btn {
            background-color: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>SocialUkrBoost</h2>
        <p>Платформа для просування та підтримки українських спільнот і контенту.</p>
        
        <div class="balance">Баланс: <span id="userBalance">0.00</span> GRAM</div>

        <button class="btn" id="watchAdBtn">Дивитись рекламу</button>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        document.getElementById('watchAdBtn').addEventListener('click', () => {
            // Тут надалі буде інтеграція Adsgram SDK
            alert("Тестовий перегляд зараховано!");
            
            const payload = JSON.stringify({
                event: "ad_watched",
                reward: 0.01
            });
            if (window.Telegram.WebApp.sendData) {
                window.Telegram.WebApp.sendData(payload);
            }
        });
    </script>
</body>
</html>

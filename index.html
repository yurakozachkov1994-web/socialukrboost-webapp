<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Boost | Просування</title>
    <!-- Підключаємо офіційний скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .status {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #707579);
            margin-top: 5px;
        }
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #707579);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>SocialUkrBoost</h2>
        
        <button class="btn" id="watchAdBtn">Дивитись рекламу (Тест)</button>
        <div class="status" id="statusText">Режим симуляції (Сервер реклами недоступний)</div>
    </div>

    <div class="footer">@socialukrboost_bot</div>

    <script>
        // Ініціалізація Telegram Web App
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        const watchAdBtn = document.getElementById('watchAdBtn');
        const statusText = document.getElementById('statusText');

        watchAdBtn.addEventListener('click', () => {
            // Тут ви можете згодом підключити реальний SDK реклами (наприклад, Adsgram)
            // Зараз працює симуляція успішного перегляду:

            statusText.innerText = "Рекламу переглянуто! Нараховуємо бонус...";

            // Формуємо дані для відправки в бот (сума 0.01)
            const payload = JSON.stringify({
                event: "ad_watched",
                reward: 0.01
            });

            // Відправляємо дані назад у Telegram-бот та закриваємо міні-додаток
            if (window.Telegram.WebApp.sendData) {
                window.Telegram.WebApp.sendData(payload);
            } else {
                console.log("SendData не підтримується у цьому браузері:", payload);
                alert("Готово! Але запуск йде поза Telegram.");
            }
        });
    </script>
</body>
</html>
